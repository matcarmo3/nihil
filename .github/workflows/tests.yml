# Every push and pull request: both compilers, their equivalence and the
# collector, on a clean Ubuntu (x86_64), the same checks as on the notebook.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install nasm
        run: sudo apt-get update -q && sudo apt-get install -y -q nasm && nasm -v

      - name: Build (stage 0 in assembly, stage 1 in Nihil)
        run: make

      - name: Tests, stage 0
        run: make test

      - name: Tests, stage 1
        run: make test1

      - name: Tests, stage 1 without optimizations
        run: make test1-O0

      - name: Stage 0 and stage 1 give identical bytes
        run: make compare

      - name: Fixed point (the compiler compiles itself)
        run: make fixedpoint

      - name: FLOAT and text, checked against Python
        run: make floatcheck

      - name: Garbage collector under pressure
        run: make gcstress
