<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nihil IDE</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/simple.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-webgl@0.16.0/lib/xterm-addon-webgl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-canvas@0.5.0/lib/xterm-addon-canvas.js"></script>
<style>
:root {
  --bg: #16171d; --panel: #1d1f27; --panel2: #252833; --line: #2f3340; --text: #d7dae0;
  --dim: #8a90a0; --accent: #e8a33c; --ok: #6cc070; --err: #ef6b6b; --sel: #2c3a55;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: grid; grid-template-rows: 42px 1fr 24px; height: 100vh; }
header { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel);
  border-bottom: 1px solid var(--line); }
header .logo { font-weight: 700; letter-spacing: .5px; margin-right: 10px; }
header .logo { display: flex; align-items: center; gap: 8px; }
header .logo img { width: 26px; height: 26px; }
header .logo span { color: #19e3e8; font-weight: 600; }
button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 11px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--dim); }
button.primary { background: var(--accent); color: #1a1406; border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .45; cursor: default; }
label.opt { display: flex; gap: 5px; align-items: center; color: var(--dim); margin-left: 6px; cursor: pointer; }
.spacer { flex: 1; }
#current { color: var(--dim); font-family: ui-monospace, monospace; }
#current.dirty::after { content: " ●"; color: var(--accent); }
main { display: grid; grid-template-columns: 220px 1fr; min-height: 0; }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px 0; }
aside h3 { margin: 8px 12px 4px; font-size: 11px; text-transform: uppercase; color: var(--dim); letter-spacing: .8px; }
aside .file { padding: 3px 12px 3px 20px; cursor: pointer; font-family: ui-monospace, monospace; font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
aside .file:hover { background: var(--panel2); }
aside .file.active { background: var(--sel); }
#work { display: grid; grid-template-rows: 1fr 6px 38%; min-height: 0; min-width: 0; }
#editor { min-height: 0; }
.CodeMirror { height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.5 ui-monospace, "JetBrains Mono", Menlo, monospace; }
.CodeMirror-gutters { background: var(--bg); border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: #555b6b; }
.CodeMirror-cursor { border-left: 2px solid var(--accent); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--sel); }
.CodeMirror-matchingbracket { color: var(--accent) !important; text-decoration: underline; }
.cm-s-default .cm-comment { color: #6b7385; font-style: italic; }
.cm-s-default .cm-string { color: #9ccc65; } .cm-s-default .cm-string-2 { color: #c5e1a5; }
.cm-s-default .cm-number { color: #f4a261; } .cm-s-default .cm-atom { color: #c792ea; }
.cm-s-default .cm-keyword { color: var(--accent); font-weight: 600; }
.cm-s-default .cm-operator { color: #89ddff; } .cm-s-default .cm-def { color: #82aaff; } .cm-s-default .cm-variable-2 { color: #ffcb6b; } .cm-s-default .cm-variable { color: var(--text); }
.cm-s-default .cm-builtin { color: #ff8a80; }
.err-line { background: rgba(239, 107, 107, .12); }
.err-mark { text-decoration: wavy underline var(--err); }
.gutter-err { color: var(--err); font-size: 12px; padding-left: 3px; cursor: default; }
#splitter { background: var(--line); cursor: row-resize; }
#bottom { display: grid; grid-template-rows: 32px 1fr; background: var(--panel); min-height: 0; }
.tabs { display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--line); }
.tab { padding: 6px 12px; cursor: pointer; color: var(--dim); border-bottom: 2px solid transparent; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tab .count { background: var(--err); color: #fff; border-radius: 8px; padding: 0 6px; margin-left: 5px; font-size: 11px; }
.pane { display: none; min-height: 0; overflow: auto; }
.pane.active { display: block; }
#terminal { padding: 6px 0 0 8px; height: 100%; background: #101116; }
#problems .item { padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  font-family: ui-monospace, monospace; font-size: 12px; }
#problems .item:hover { background: var(--panel2); }
#problems .where { color: var(--dim); margin-right: 8px; }
#problems .msg { color: var(--err); }
#problems .empty, #asm .empty { padding: 12px; color: var(--dim); }
#asm pre { margin: 0; padding: 8px 12px; font: 12px/1.45 ui-monospace, monospace; color: #b8bfcc; white-space: pre; }
#asm .addr { color: #555b6b; } #asm .bytes { color: #464b58; } #asm .mn { color: #82aaff; }
footer { display: flex; align-items: center; gap: 16px; padding: 0 12px; background: var(--panel);
  border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
footer .ok { color: var(--ok); } footer .bad { color: var(--err); }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
dialog input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 5px;
  padding: 6px 8px; font: 13px ui-monospace, monospace; width: 320px; }
dialog::backdrop { background: rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><img src="/static/mark.png" alt="">Nihil <span>IDE</span></div>
    <button id="btnNew" title="New file">New</button>
    <button id="btnSave" title="Save (Ctrl+S)">Save</button>
    <button id="btnRun" class="primary" title="Save and run (Ctrl+Enter)">▶ Run</button>
    <button id="btnStop" disabled title="Stop the program">■ Stop</button>
    <button id="btnAsm" title="Show the generated machine code">Assembly</button>
    <label class="opt" title="Compile with the M9 optimizations (off = NIHIL_O0=1)"><input type="checkbox" id="optimize" checked> optimize</label>
    <div class="spacer"></div>
    <div id="current"></div>
  </header>
  <main>
    <aside id="files"></aside>
    <div id="work">
      <div id="editor"></div>
      <div id="splitter"></div>
      <div id="bottom">
        <div class="tabs">
          <div class="tab active" data-pane="terminal">Terminal</div>
          <div class="tab" data-pane="problems">Problems<span class="count" id="probCount" hidden></span></div>
          <div class="tab" data-pane="asm">Assembly</div>
        </div>
        <div class="pane active" id="terminal"></div>
        <div class="pane" id="problems"><div class="empty">No problems.</div></div>
        <div class="pane" id="asm"><div class="empty">Click "Assembly" to see the machine code of the current file.</div></div>
      </div>
    </div>
  </main>
  <footer><span id="status">Ready</span><div class="spacer"></div><span id="cursorPos"></span></footer>
</div>
<dialog id="newDialog"><form method="dialog">
  <div style="margin-bottom:8px">New file (inside <code>ide/workspace/</code> or <code>examples/</code>):</div>
  <input id="newName" value="ide/workspace/untitled.nihil" autocomplete="off">
  <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
    <button value="cancel">Cancel</button><button value="ok" class="primary">Create</button>
  </div>
</form></dialog>
<script>
if (!window.CodeMirror || !window.Terminal || !CodeMirror.defineSimpleMode) {
  document.body.innerHTML = '<p style="padding:24px;font:15px system-ui;color:#ef6b6b">The Nihil IDE could not load its editor or terminal libraries ' +
    '(CodeMirror ' + (window.CodeMirror ? 'ok' : 'missing') + ', xterm.js ' + (window.Terminal ? 'ok' : 'missing') +
    '). This browser needs internet access to cdnjs.cloudflare.com and cdn.jsdelivr.net.</p>';
  throw new Error('libraries missing');
}
// ---------------------------------------------------------------- Nihil syntax
CodeMirror.defineSimpleMode('nihil', {
  start: [
    { regex: /\/\/.*/, token: 'comment' },
    { regex: /\/\*/, token: 'comment', next: 'comment' },
    { regex: /"(?:[^\\"]|\\.)*"?/, token: 'string' },
    { regex: /'(?:[^\\']|\\.)*'?/, token: 'string-2' },
    { regex: /0x[0-9a-fA-F]+|\d+\.\d+(?:[eE][-+]?\d+)?|\d+/, token: 'number' },
    { regex: /\b(?:true|false)\b|\b_\b/, token: 'atom' },
    { regex: /!>>|>>>|<<<|>>|<<|::|\.\.\.|\|\||&&/, token: 'keyword' },
    { regex: /[@$#]/, token: 'builtin' },
    { regex: /^(\s*)([A-Za-z_]\w*)(?=\s*\([^)]*\)\s*\{)/, token: [null, 'def'] },
    { regex: /[A-Za-z_]\w*(?=\s*\()/, token: 'def' },
    { regex: /\b[A-Z][A-Z0-9_]+\b/, token: 'variable-2' },
    { regex: /[A-Za-z_]\w*\??/, token: 'variable' },
    { regex: /[-+*\/%=<>!&|^~:?.]+/, token: 'operator' },
    { regex: /[{\[(]/, indent: true }, { regex: /[}\])]/, dedent: true },
  ],
  comment: [ { regex: /.*?\*\//, token: 'comment', next: 'start' }, { regex: /.*/, token: 'comment' } ],
  meta: { lineComment: '//', blockCommentStart: '/*', blockCommentEnd: '*/', electricChars: '}]' },
});

// ---------------------------------------------------------------- state
const $ = (id) => document.getElementById(id);
let current = null, editable = true, savedText = '', runId = null, marks = [];
const editor = CodeMirror($('editor'), {
  mode: 'nihil', lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
  matchBrackets: true, autoCloseBrackets: true, gutters: ['errors', 'CodeMirror-linenumbers'],
  extraKeys: {
    'Ctrl-S': save, 'Cmd-S': save, 'Ctrl-Enter': run, 'Cmd-Enter': run,
    'Ctrl-/': 'toggleComment', 'Cmd-/': 'toggleComment',
    Tab: (cm) => cm.somethingSelected() ? cm.indentSelection('add') : cm.replaceSelection('    '),
  },
});
editor.on('change', () => { $('current').classList.toggle('dirty', editor.getValue() !== savedText); clearMarks(); });
editor.on('cursorActivity', () => { const c = editor.getCursor(); $('cursorPos').textContent = `Ln ${c.line + 1}, Col ${c.ch + 1}`; });

function status(text, cls = '') { const s = $('status'); s.textContent = text; s.className = cls; }
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  return r.json();
}

// ---------------------------------------------------------------- terminal
const term = new Terminal({ fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 13, cursorBlink: true,
  convertEol: true, scrollback: 5000, theme: { background: '#101116', foreground: '#d7dae0', cursor: '#e8a33c' } });
term.open($('terminal'));
const fit = window.FitAddon ? new FitAddon.FitAddon() : null;
if (fit) term.loadAddon(fit);
// a GPU renderer: the default DOM one cannot keep up with full-screen color animation
// (#renderer=dom|canvas|webgl in the URL forces one)
let renderer = 'dom';
const wantRenderer = new URLSearchParams(location.hash.slice(1)).get('renderer') || 'canvas';
if (wantRenderer === 'webgl') {
  try {
    const gl = new WebglAddon.WebglAddon();
    gl.onContextLoss(() => gl.dispose());
    term.loadAddon(gl); renderer = 'webgl';
  } catch (e) {}
}
if (renderer === 'dom' && wantRenderer !== 'dom') {
  try { term.loadAddon(new CanvasAddon.CanvasAddon()); renderer = 'canvas'; } catch (e) {}
}

// Program output goes through a small scheduler. Text is written in order, but a
// full-screen animation (each frame starts with "\x1b[H", cursor home) may arrive
// faster than the browser draws it: then the frames in between are skipped and
// only the newest one is drawn, so the animation stays in real time instead of
// piling up (lagging) and then rushing through the backlog.
const FRAME = '\x1b[H';
let pending = '', writing = false, stats = { drawn: 0, skipped: 0 };
function output(text) { pending += text; pump(); }
function pump(final = false) {
  if (writing || !pending) return;
  let chunk;
  const last = pending.lastIndexOf(FRAME);
  if (last <= 0 || final) {                       // no frame boundary to wait for
    chunk = pending; pending = '';
  } else {
    const first = pending.indexOf(FRAME);
    const prev = pending.lastIndexOf(FRAME, last - 1);
    if (first < last && prev > first) {           // two or more complete frames waiting
      stats.skipped += pending.slice(first, prev).split(FRAME).length - 1;
      chunk = pending.slice(0, first) + pending.slice(prev, last);
    } else {
      chunk = pending.slice(0, last);
    }
    pending = pending.slice(last);                // the newest frame may be incomplete
  }
  stats.drawn += chunk.split(FRAME).length - 1;
  writing = true;
  term.write(chunk, () => { writing = false; setTimeout(pump, 0); });
}
// Playout buffer: every piece of output carries the time the program wrote it.
// Pieces are shown at that time plus a small delay, which absorbs the bursts of
// the network path; if one arrives later than that, the delay grows (up to 600 ms)
// and frames that are already overdue are skipped by pump().
let playQueue = [], playBase = null, playDelay = 80, playTimer = null, maxLate = 0;
function schedule(ms, text) {
  const now = performance.now();
  if (playBase === null) playBase = now - ms;           // program time 0, in page time
  const late = now - (playBase + ms + playDelay);
  if (late > 0) { maxLate = Math.max(maxLate, late); playDelay = Math.min(600, playDelay + late + 20); }
  playQueue.push({ at: playBase + ms, text });
  play();
}
function play() {
  clearTimeout(playTimer);
  const now = performance.now();
  while (playQueue.length && playQueue[0].at + playDelay <= now) output(playQueue.shift().text);
  if (playQueue.length) playTimer = setTimeout(play, Math.max(1, playQueue[0].at + playDelay - now));
}
function drainPlayout() {                          // the program ended: release what is left on time
  return new Promise((done) => {
    const check = () => playQueue.length ? setTimeout(check, 10) : done();
    check();
  });
}

function flushOutput() {                          // the program ended: write everything left
  return new Promise((done) => {
    const wait = () => { if (writing) return setTimeout(wait, 10); pump(true); term.write('', done); };
    wait();
  });
}

function fitTerm() { if (fit && $('terminal').classList.contains('active')) try { fit.fit(); } catch (e) {} }
new ResizeObserver(fitTerm).observe($('terminal'));
term.writeln('\x1b[2mNihil IDE: output of your programs appears here.\x1b[0m');

// line-buffered input, like a terminal in cooked mode
let line = '';
term.onData((d) => {
  if (!runId) return;
  for (const ch of d) {
    if (ch === '\r') { term.write('\r\n'); api('/api/stdin', { id: runId, data: line + '\n' }); line = ''; }
    else if (ch === '\x7f') { if (line) { line = line.slice(0, -1); term.write('\b \b'); } }
    else if (ch === '\x04') { if (line) api('/api/stdin', { id: runId, data: line }); line = ''; api('/api/stdin', { id: runId, eof: true }); }
    else if (ch === '\x03') { stop(); }
    else if (ch >= ' ') { line += ch; term.write(ch); }
  }
});

// ---------------------------------------------------------------- files
async function loadFiles() {
  const { files } = await api('/api/files');
  const groups = {};
  for (const f of files) { const d = f.slice(0, f.lastIndexOf('/')); (groups[d] = groups[d] || []).push(f); }
  const box = $('files'); box.innerHTML = '';
  for (const [dir, list] of Object.entries(groups)) {
    const h = document.createElement('h3'); h.textContent = dir; box.appendChild(h);
    for (const f of list) {
      const el = document.createElement('div'); el.className = 'file' + (f === current ? ' active' : '');
      el.textContent = f.slice(dir.length + 1); el.title = f; el.onclick = () => open(f); box.appendChild(el);
    }
  }
  return files;
}
async function open(path, line, col) {
  if (path !== current) {
    if (editable && current && editor.getValue() !== savedText && !confirm(`Discard the changes to ${current}?`)) return false;
    const r = await api('/api/file?path=' + encodeURIComponent(path));
    if (r.error) { status(r.error, 'bad'); return false; }
    current = path; editable = r.editable; savedText = r.content;
    editor.setValue(r.content); editor.clearHistory(); editor.setOption('readOnly', !editable);
    $('current').textContent = path + (editable ? '' : '  (read only)'); $('current').classList.remove('dirty');
    try { localStorage.setItem('nihil-ide-file', path); } catch (e) {}
    loadFiles();
  }
  if (line) { editor.setCursor({ line: line - 1, ch: Math.max(0, col - 1) }); editor.scrollIntoView(null, 120); }
  editor.focus();
  return true;
}
async function save() {
  if (!current || !editable) return true;
  const text = editor.getValue();
  const r = await api('/api/file', { path: current, content: text });
  if (r.error) { status(r.error, 'bad'); return false; }
  savedText = text; $('current').classList.remove('dirty'); status('Saved ' + current);
  return true;
}
$('btnNew').onclick = () => { $('newDialog').showModal(); $('newName').select(); };
$('newDialog').addEventListener('close', async () => {
  if ($('newDialog').returnValue !== 'ok') return;
  let p = $('newName').value.trim(); if (!p.endsWith('.nihil')) p += '.nihil';
  const r = await api('/api/file', { path: p, content: '// ' + p.split('/').pop() + '\n>> "Hello, Nihil!\\n";\n' });
  if (r.error) return status(r.error, 'bad');
  await loadFiles(); open(r.path);
});
$('btnSave').onclick = save;

// ---------------------------------------------------------------- problems
function clearMarks() { for (const m of marks) m.clear(); marks = []; editor.clearGutter('errors');
  editor.eachLine((l) => editor.removeLineClass(l, 'background', 'err-line')); }
function showProblems(errors) {
  clearMarks();
  const box = $('problems'); box.innerHTML = '';
  $('probCount').hidden = !errors.length; $('probCount').textContent = errors.length;
  if (!errors.length) { box.innerHTML = '<div class="empty">No problems.</div>'; return; }
  for (const e of errors) {
    const el = document.createElement('div'); el.className = 'item';
    el.innerHTML = `<span class="where"></span><span class="msg"></span>`;
    el.querySelector('.where').textContent = e.line ? `${e.file}:${e.line}:${e.col}` : e.file;
    el.querySelector('.msg').textContent = e.message;
    el.onclick = () => e.line && open(e.file, e.line, e.col);
    box.appendChild(el);
    if (e.file === current && e.line) {
      const ln = e.line - 1, text = editor.getLine(ln) || '';
      editor.addLineClass(ln, 'background', 'err-line');
      const g = document.createElement('div'); g.className = 'gutter-err'; g.textContent = '●'; g.title = e.message;
      editor.setGutterMarker(ln, 'errors', g);
      const start = Math.max(0, e.col - 1), m = /^[\w.]+|^\S/.exec(text.slice(start));
      marks.push(editor.markText({ line: ln, ch: start }, { line: ln, ch: start + (m ? m[0].length : 1) }, { className: 'err-mark', title: e.message }));
    }
  }
}

// ---------------------------------------------------------------- run
function setRunning(on) { $('btnRun').disabled = on; $('btnStop').disabled = !on; }
async function run() {
  if (runId || !current) return;
  if (!(await save())) return;
  showTab('terminal'); setRunning(true); status('Compiling…');
  const r = await api('/api/run', { path: current, optimize: $('optimize').checked });
  if (!r.ok) {
    setRunning(false); showProblems(r.errors || []); showTab('problems');
    status(`Compilation failed (${r.errors ? r.errors.length : 0} problem${r.errors && r.errors.length === 1 ? '' : 's'})`, 'bad');
    const e = (r.errors || [])[0]; if (e && e.line) open(e.file, e.line, e.col);
    return;
  }
  showProblems([]);
  term.write(`\x1b[0m\x1b[2m──── ${current} · compiled in ${r.compile_ms} ms · ${r.size} bytes ────\x1b[0m\r\n`);
  status('Running…'); runId = r.run; line = ''; term.focus();
  pending = ''; stats = { drawn: 0, skipped: 0 };
  playQueue = []; playBase = null; playDelay = 80; maxLate = 0;
  const live = setInterval(() => { if (stats.drawn > 1) status(`Running… ${stats.drawn} frames drawn, ${stats.skipped} skipped (${renderer}, buffer ${Math.round(playDelay)} ms)`); }, 500);
  const t0 = performance.now();
  try {
    const resp = await fetch('/api/stream?id=' + r.run);
    const reader = resp.body.getReader();
    let buf = new Uint8Array(0), code = null;
    const dec = new TextDecoder(), decErr = new TextDecoder();
    while (code === null) {
      const { value, done } = await reader.read();
      if (done) break;
      const nb = new Uint8Array(buf.length + value.length); nb.set(buf); nb.set(value, buf.length); buf = nb;
      while (buf.length >= 9) {
        const u32 = (i) => (buf[i] << 24 | buf[i + 1] << 16 | buf[i + 2] << 8 | buf[i + 3]) >>> 0;
        const len = u32(1), ms = u32(5);
        if (buf.length < 9 + len) break;
        const kind = buf[0], data = buf.slice(9, 9 + len); buf = buf.slice(9 + len);
        if (kind === 1) schedule(ms, dec.decode(data, { stream: true }));
        else if (kind === 2) schedule(ms, '\x1b[31m' + decErr.decode(data, { stream: true }) + '\x1b[0m');
        else code = parseInt(new TextDecoder().decode(data), 10);
      }
    }
    if (code < 0) { playQueue = []; } else { await drainPlayout(); }
    await flushOutput();
    const secs = ((performance.now() - t0) / 1000).toFixed(2);
    const killed = code < 0;
    const anim = stats.drawn > 1 ? ` · ${stats.drawn} frames drawn, ${stats.skipped} skipped (${renderer})` : '';
    term.write(`\x1b[0m\x1b[?25h\r\n\x1b[2m──── ${killed ? 'stopped' : 'exit code ' + code} · ${secs} s ────\x1b[0m\r\n`);
    status((killed ? 'Stopped' : `Finished with exit code ${code} in ${secs} s`) + anim, code === 0 ? 'ok' : 'bad');
  } catch (err) { status('Connection lost: ' + err.message, 'bad'); }
  clearInterval(live); runId = null; setRunning(false);
}
async function stop() { if (runId) await api('/api/stop', { id: runId }); }
$('btnRun').onclick = run; $('btnStop').onclick = stop;

// ---------------------------------------------------------------- assembly
$('btnAsm').onclick = async () => {
  if (!current || !(await save())) return;
  showTab('asm'); $('asm').innerHTML = '<div class="empty">Compiling…</div>';
  const r = await api('/api/asm', { path: current, optimize: $('optimize').checked });
  if (!r.ok) { showProblems(r.errors || []); showTab('problems'); return; }
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const html = r.asm.split('\n').map((l) => {
    const m = /^\s*([0-9a-f]+):\t([0-9a-f ]+)\t?(\S*)\s*(.*)$/.exec(l);
    return m ? `<span class="addr">${m[1]}</span>  <span class="bytes">${m[2].trim().padEnd(24)}</span> <span class="mn">${esc(m[3])}</span> ${esc(m[4])}` : esc(l);
  }).join('\n');
  $('asm').innerHTML = `<div class="empty">${r.size} bytes · ${r.asm.split('\n').length} instructions · ${$('optimize').checked ? 'optimized' : '-O0'} · the runtime comes first, your program after it</div><pre>${html}</pre>`;
  status(`Assembly: ${r.size} bytes`);
};

// ---------------------------------------------------------------- layout
function showTab(name) {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.pane === name));
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('active', p.id === name));
  if (name === 'terminal') setTimeout(fitTerm, 0);
}
document.querySelectorAll('.tab').forEach((t) => t.onclick = () => showTab(t.dataset.pane));
$('splitter').onmousedown = (e) => {
  e.preventDefault();
  const work = $('work'), top = work.getBoundingClientRect().top, h = work.clientHeight;
  const move = (ev) => { const y = Math.min(h - 80, Math.max(80, ev.clientY - top));
    work.style.gridTemplateRows = `${y}px 6px ${h - y - 6}px`; editor.refresh(); fitTerm(); };
  const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
};
addEventListener('beforeunload', (e) => { if (editable && current && editor.getValue() !== savedText) e.preventDefault(); });
addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); save(); }
});

(async () => {
  const files = await loadFiles();
  let last = null; try { last = localStorage.getItem('nihil-ide-file'); } catch (e) {}
  const want = new URLSearchParams(location.hash.slice(1));    // #open=path or #run=path
  const target = want.get('run') || want.get('open');
  await open(files.includes(target) ? target : files.includes(last) ? last : (files.includes('ide/workspace/hello.nihil') ? 'ide/workspace/hello.nihil' : files[0]));
  if (want.get('run')) run();
})();
</script>
</body>
